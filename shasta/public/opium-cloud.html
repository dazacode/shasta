<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cloud games</title>
<!--
  Opium Cloud player — self-contained, no build step.
  - Served standalone at /opium-cloud.html -> browse + play the whole cloud catalogue.
  - Baked into a Store package per game (window.__OPIUM__ set) -> auto-plays that game.
  - Linked apps open /opium-cloud.html?g=<key>.

  Control plane: Shasta's /cloud proxy when one answers, else the public "stratus" mirrors (CORS reflects our origin).
  Picture: WebRTC via the provider's TURN server, plus Shasta's TURN-over-TLS 443 front when /cloud/relay names one.
  Details button = media-path diagnostics; ?ice=relay forces relayed candidates, ?ice=tls tests ONLY the 443 relay.
  Protocol recovered by REA from opium.best's own main.js; see ../opium-recon/README.md.
-->
<style>
  :root { --bg:#0a0b10; --panel:#14161f; --line:#232634; --fg:#e7e9ee; --muted:#9aa0ad; --accent:#7c8cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:3; }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .count { color:var(--muted); font-size:12px; }
  input[type=search] { margin-left:auto; width:min(320px,40vw); background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:9px 12px; outline:none; }
  input[type=search]:focus { border-color:var(--accent); }
  #status { padding:6px 14px; color:var(--muted); font-size:12px; min-height:18px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:12px; padding:12px 14px 40px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .card img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:#0d0f16; }
  .card .m { padding:8px 9px; }
  .card .m b { display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .m span { display:block; font-size:10.5px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { padding:40px; color:var(--muted); text-align:center; grid-column:1/-1; }
  /* player */
  #player { position:fixed; inset:0; background:#000; display:none; z-index:20; }
  #player.on { display:block; }
  #video { width:100%; height:100%; object-fit:contain; background:#000; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:20px; }
  #overlay.gone { display:none; }
  #overlay img { width:140px; border-radius:12px; box-shadow:0 10px 40px #000; }
  #overlay b { font-size:18px; }
  #overlay small { color:var(--muted); }
  .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center; padding:10px 12px; background:linear-gradient(#000c,#0000); opacity:0; transition:opacity .2s; }
  #player.showbar .bar, #player:hover .bar { opacity:1; }
  .bar .t { font-weight:600; font-size:13px; }
  .bar .sp { flex:1; }
  .btn { background:#ffffff14; border:1px solid #ffffff22; color:#fff; border-radius:9px; padding:7px 11px; cursor:pointer; font-size:12.5px; }
  .btn:hover { background:#ffffff22; }
  .spin { width:22px; height:22px; border:2px solid #fff3; border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .err { color:#ff9d9d; }
  #hint { position:absolute; bottom:12px; left:0; right:0; text-align:center; color:#ffffff88; font-size:12px; }
  /* media-path diagnostics: the one screen a locked-down Chromebook (no devtools) can copy from */
  #diag { position:absolute; left:0; right:0; bottom:0; max-height:52%; overflow:auto; display:none; background:#05070ce6; color:#cfe0ff; font:11px/1.5 ui-monospace,Menlo,monospace; padding:10px 12px 16px; border-top:1px solid #2a2f45; }
  #diag.on { display:block; }
  #diag h4 { margin:0 0 7px; font:600 12px system-ui,sans-serif; color:#fff; display:flex; gap:8px; align-items:center; }
  #diag .k { color:#8b93a7; }
  #diag .v { color:#e7e9ee; }
  #diag .bad { color:#ff9d9d; }
  #diag .good { color:#9dffb0; }
  #diag pre { margin:7px 0 0; white-space:pre-wrap; word-break:break-word; color:#aeb6c8; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cloud games</h1>
    <span class="count" id="count"></span>
    <input id="q" type="search" placeholder="Search cloud games…" autocomplete="off" />
  </header>
  <div id="status">starting…</div>
  <div id="grid"></div>
</div>

<div id="player">
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <img id="pcover" alt="" />
    <b id="pname"></b>
    <div id="pmsg"><span class="spin"></span></div>
    <small id="psub"></small>
  </div>
  <div class="bar">
    <span class="t" id="pbar"></span>
    <span class="sp"></span>
    <button class="btn" id="diagbtn">Details</button>
    <button class="btn" id="pfull">Full screen</button>
  </div>
  <div id="hint"></div>
  <div id="diag"></div>
</div>

<script>
// Baked config for a package build; null when this is the browsable page.
window.__OPIUM__ = /*__CONFIG__*/null;
// Where the cloud API lives (self-hosted stratus-api or the mirrors). null = built-in default.
window.__OPIUM_API__ = /*__API__*/null;
// Shasta's own /cloud proxy, baked into a package: preferred over the public mirrors, which school filters block.
window.__OPIUM_PROXY__ = /*__PROXY__*/null;
</script>
<script>
(() => {
  "use strict";
  const MIRRORS = [
    "cdn.vipersfutbol.com", "cdn.northstreetumc.org", "cdn.pcesc.org",
    "cdn.kcchallengevbc.com", "cdn.slcbmooc.org", "cdn.topstargym.net",
    "cdn.goaplytexas.org", "cdn.clearfieldswimming.org", "cdn.richardacademy.cfd",
  ];
  const $ = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const cfg = window.__OPIUM__ || (qs.get("g") ? { key: qs.get("g"), name: qs.get("n") || "", cover: qs.get("c") || "" } : null);
  let HOST = qs.get("h") || null;

  // Where the cloud API lives. Default: opium's /stratus mirrors. Point at a self-hosted
  // x8rr/stratus-api instead with window.__OPIUM_API__ = { base, prefix:"cloud/v1", key, catalog }
  // (or ?api=&prefix=cloud/v1&key=&catalog=). The two speak the same session/WebRTC protocol.
  const API = Object.assign(
    { base: qs.get("api") || "", prefix: qs.get("prefix") || "stratus", key: qs.get("key") || "", catalog: qs.get("catalog") || "" },
    window.__OPIUM_API__ || {},
  );
  const V1 = API.prefix === "cloud/v1";
  const apiBase = () => (API.base || `https://${HOST}`).replace(/\/+$/, "");
  const apiHdr = (json) => { const h = {}; if (API.key) h["x-api-key"] = API.key; if (json) h["content-type"] = "application/json"; return h; };
  const urlFor = (p) => `${apiBase()}/${V1 ? "cloud/v1" : "stratus"}/${p}`;
  // every request gives up after a while: a relay that a network black-holes must never hang the player
  const tfetch = (u, opt = {}, ms = 12000) => fetch(u, { ...opt, signal: AbortSignal.timeout(ms) });
  const rndKey = () => [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");

  // The mirrors sit behind Cloudflare, which sometimes answers with a JS "managed challenge" instead of the API
  // (seen on datacenter/VPN/school IPs). A fetch cannot solve it, but a hidden iframe lets the browser do it once;
  // after that the challenge cookie (cf_clearance) rides along and the plain fetch works. Detected by the
  // `cf-mitigated: challenge` header (or any HTML answer, which is never the JSON API).
  const looksChallenged = (r) => !r.ok && (r.headers.get("cf-mitigated") === "challenge" || /text\/html/i.test(r.headers.get("content-type") || ""));
  const warmed = new Set();
  /** add a hidden iframe to the relay once, so the browser solves Cloudflare's challenge for that relay */
  function warm(host) {
    if (!host || warmed.has(host)) return;
    warmed.add(host);
    const f = document.createElement("iframe");
    f.setAttribute("aria-hidden", "true");
    f.style.cssText = "width:2px;height:2px;position:fixed;left:-40px;top:-40px;opacity:0;pointer-events:none;border:0";
    f.src = `https://${host}/stratus/status`;
    document.body.appendChild(f);
  }
  /** one API request; a challenged relay is warmed once, then the request retried until the challenge clears */
  async function request(p, opt = {}) {
    const go = () => tfetch(urlFor(p), { method: opt.method || "GET", headers: apiHdr(!!opt.body), body: opt.body ? JSON.stringify(opt.body) : undefined, credentials: "include" }, opt.ms);
    // a Cloudflare challenge carries no CORS headers, so the fetch REJECTS instead of returning the 403
    const attempt = () => go().catch(() => null);
    let r = await attempt();
    if (r && (!looksChallenged(r) || API.base)) return r;
    if (!HOST) {
      if (r) return r;
      throw new Error("no relay");
    }
    warm(HOST); // the browser solves it inside the iframe; keep asking until it lets us through
    const until = Date.now() + (opt.challengeMs ?? 120000);
    while (Date.now() < until) {
      await new Promise((res) => setTimeout(res, 2500));
      r = await attempt();
      if (r && !looksChallenged(r)) return r;
    }
    if (r && !looksChallenged(r)) return r;
    throw new Error("this network's security check did not clear");
  }
  const jfetch = (p, opt = {}) => request(p, opt).then((r) => r.json());

  // ---- prefer Shasta's own /cloud proxy -------------------------------------------------
  // The mirrors are third-party domains (cdn.pcesc.org, …) that a school filter easily blocks, while
  // Shasta's own host is allowed. When a proxy answers, every request (and the signalling WebSocket)
  // goes through it, so the browser never touches a blocked domain. No proxy = the raw mirrors, as before.
  // Last resort is the full site's own proxy, so a Lite mirror (no backend of its own) still works.
  const FULL_CLOUD = "https://edushasta.lol/cloud";
  const PROXY_BASES = [...new Set([window.__OPIUM_PROXY__, `${location.origin}/cloud`, FULL_CLOUD].filter(Boolean).map((b) => b.replace(/\/+$/, "")))];
  let apiReady = null;
  const probeProxy = (base) =>
    tfetch(`${base}/stratus/status`, { cache: "no-store", credentials: "include" }, 4000)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => !!(j && j.pool))
      .catch(() => false);
  /** point API.base at the first working proxy once; a no-op when the caller set an explicit API */
  function ensureApi() {
    if (API.base || !PROXY_BASES.length) return Promise.resolve();
    apiReady ??= (async () => {
      for (const base of PROXY_BASES) if (await probeProxy(base)) { API.base = base; return; }
    })();
    return apiReady;
  }

  // ---- cloud API adapter: /stratus (opium mirrors) <-> /cloud/v1 (stratus-api) ----
  const norm = (g) => (g && (g.key || g.game_key) && g.name ? { key: g.key || g.game_key, name: g.name, image: g.image, cover: g.cover, tags: g.tags, description: g.description } : null);
  async function createSession(key) {
    if (V1) {
      const r = await tfetch(urlFor("createSession"), { method: "POST", headers: apiHdr(true), body: JSON.stringify({ game_key: key }) });
      const text = await r.text();
      let last = null;
      for (const line of text.split("\n")) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.status === "error") return { error: ev.error };
        last = ev;
      }
      if (!last) return { error: "no session" };
      if (last.status === "queue") return { uuid: last.uuid, state: "queued", queue_pos: last.queue_pos };
      if (last.status === "finished_queue") return { uuid: last.uuid, state: "finished_queue" };
      return { error: last.error || "no session" };
    }
    return jfetch("session", { method: "POST", body: { game_key: key, relay: false, client_key: rndKey() } });
  }
  async function pollSession(uuid) {
    if (V1) { const j = await tfetch(urlFor(`getQueue?uuid=${uuid}`), { headers: apiHdr() }).then((r) => r.json()); return { state: j.status === "finished_queue" ? "finished_queue" : "queued", queue_pos: j.queue_pos, error: j.error }; }
    return jfetch(`session/${uuid}`);
  }
  const startSession = (uuid) => (V1 ? tfetch(urlFor("startGame"), { method: "POST", headers: apiHdr(true), body: JSON.stringify({ uuid }) }).then((r) => r.json()) : jfetch(`session/${uuid}/start`, { method: "POST", body: {} }));
  const signalUrl = (uuid, st) => (V1 ? st.signaling_ws : `${apiBase().replace(/^http/, "ws")}/stratus/signal/${uuid}`);
  function quitSession(uuid) {
    if (V1) return void fetch(urlFor("quitSession"), { method: "POST", headers: apiHdr(true), body: JSON.stringify({ uuid }), keepalive: true }).catch(() => {});
    return void fetch(urlFor(`session/${uuid}/quit`), { method: "POST", headers: { "content-type": "application/json" }, body: "{}", keepalive: true }).catch(() => {});
  }

  let HOSTS = [];
  let challengeHost = false;
  const sleepMs = (ms) => new Promise((res) => setTimeout(res, ms));
  const probeStatus = async (h) => {
    try {
      const r = await fetch(`https://${h}/stratus/status`, { signal: AbortSignal.timeout(5000) });
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.pool ? { h, idle: j?.pool?.idle ?? 0, down: !!j?.pool?.health?.down } : null;
    } catch {
      return null; // a challenge has no CORS headers, so this rejects; so does a black-holed relay
    }
  };
  async function pickHost() {
    if (HOST) return HOST;
    // the relays are independent and churn: prefer one that is up with spare machines
    const probes = await Promise.all(MIRRORS.map(probeStatus));
    const up = probes.filter((x) => x && !x.down).sort((a, b) => b.idle - a.idle);
    if (up.length) {
      HOSTS = up.map((x) => x.h);
      return (HOST = HOSTS[0]);
    }
    // nothing answered plainly. Most likely Cloudflare's JS challenge (fetch cannot solve it, and the challenge
    // reply has no CORS so it looks like a dead host). Let the browser solve it in a hidden iframe per relay and
    // wait for one to start answering; a school/datacenter/VPN IP trips this while a normal home network does not.
    for (const h of MIRRORS) warm(h);
    challengeHost = true;
    const until = Date.now() + 120000;
    while (Date.now() < until) {
      await sleepMs(2500);
      const hit = (await Promise.all(MIRRORS.map(probeStatus))).find((x) => x && !x.down);
      if (hit) {
        HOSTS = [hit.h, ...MIRRORS.filter((h) => h !== hit.h)];
        return (HOST = hit.h);
      }
    }
    // still nothing: use them anyway (a black-holed relay fails over via nextHost)
    HOSTS = [...MIRRORS];
    return (HOST = HOSTS[0]);
  }
  /** the next relay that answered, after one failed us; false when there is none left */
  function nextHost() {
    if (API.base) return false;
    const i = HOSTS.indexOf(HOST);
    if (i < 0 || i + 1 >= HOSTS.length) return false;
    HOST = HOSTS[i + 1];
    return true;
  }
  const UNREACHABLE = "Couldn't reach the cloud servers. This network may block them; try another network, or try again in a minute.";

  // ---- catalogue ------------------------------------------------------
  let GAMES = [];
  async function loadCatalog() {
    // a one-game package needs no catalogue: start the game at once (waiting on the list hung on slow relays)
    if (cfg && cfg.key) { $("status").textContent = ""; return start(cfg.key, cfg.name, cfg.cover); }
    $("status").textContent = "finding a cloud server…";
    await ensureApi();
    if (!API.base) await pickHost();
    const tryJson = async (u) => { try { const r = await tfetch(u, { cache: "no-cache" }); if (!r.ok) return null; const j = await r.json(); return Array.isArray(j) ? j : j.games; } catch { return null; } };
    // snapshot next to the page/API -> self-hosted catalogue -> the API's own /stratus/games
    let raw = await tryJson(API.catalog || "./opium-cloud.json");
    if (!raw && V1 && API.base) raw = await tryJson(`${apiBase()}/cloud.json`);
    if (!raw && !V1) { const j = await jfetch("games").catch(() => ({})); raw = j.games || []; }
    const games = (raw || []).map(norm).filter(Boolean);
    GAMES = games;
    $("status").textContent = `${games.length} games · via ${API.base || HOST}`;
    $("count").textContent = games.length ? `${games.length} titles` : "";
    render("");
  }

  function render(filter) {
    const q = filter.trim().toLowerCase();
    const list = GAMES.filter((g) => !q || g.name.toLowerCase().includes(q) || (g.tags || []).join(" ").toLowerCase().includes(q));
    const grid = $("grid");
    if (!list.length) { grid.innerHTML = `<div class="empty">No games match “${filter}”.</div>`; return; }
    const frag = document.createDocumentFragment();
    for (const g of list) {
      const c = document.createElement("div");
      c.className = "card";
      const img = document.createElement("img");
      img.loading = "lazy"; img.decoding = "async"; img.alt = "";
      img.src = g.image || g.cover || "";
      const m = document.createElement("div");
      m.className = "m";
      const b = document.createElement("b"); b.textContent = g.name;
      const s = document.createElement("span"); s.textContent = (g.tags || []).slice(0, 3).join(" · ");
      m.append(b, s); c.append(img, m);
      c.onclick = () => start(g.key, g.name, g.cover || g.image);
      frag.appendChild(c);
    }
    grid.replaceChildren(frag);
  }

  // ---- input frames (binary over the data channel) --------------------
  let dc = null;
  function sendMouse(kind, e, wheel = 0, dx = 0, dy = 0) {
    if (!dc || dc.readyState !== "open") return;
    const v = $("video");
    const r = v.getBoundingClientRect();
    const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
    const s = Math.min(r.width / vw, r.height / vh), w = vw * s, h = vh * s;
    const l = r.left + (r.width - w) / 2, t = r.top + (r.height - h) / 2;
    const px = Math.max(0, Math.min(10000, ((e.clientX - l) / w) * 10000));
    const py = Math.max(0, Math.min(10000, ((e.clientY - t) / h) * 10000));
    const buf = new ArrayBuffer(12), d = new DataView(buf);
    d.setUint8(0, 1); d.setUint8(1, 11); d.setUint8(2, kind); d.setUint8(3, 8);
    d.setUint16(4, px); d.setUint16(6, py);
    d.setInt8(8, Math.max(-127, Math.min(127, dx))); d.setInt8(9, Math.max(-127, Math.min(127, dy)));
    d.setUint8(10, e.buttons || 0); d.setInt8(11, Math.max(-127, Math.min(127, wheel)));
    dc.send(buf);
  }
  const pressed = new Map();
  function sendKey(e, down) {
    if (!dc || dc.readyState !== "open") return;
    if (down) pressed.set(e.keyCode, 1); else pressed.delete(e.keyCode);
    const buf = new ArrayBuffer(24), d = new DataView(buf);
    d.setUint8(0, 1); d.setUint8(2, 1); d.setUint8(3, 1);
    d.setUint16(4, e.keyCode); d.setUint8(6, down ? 1 : 0);
    let o = 7;
    for (const c of pressed.keys()) if (c !== e.keyCode && c > 0 && c < 255 && o < 21) { d.setUint16(o, c); o += 2; d.setUint8(o, 1); o++; }
    d.setUint8(o++, 255); d.setUint8(1, o - 1);
    dc.send(buf.slice(0, o));
    e.preventDefault();
  }
  let last = null;
  function bindInput() {
    const v = $("video");
    const on = (t, fn, o) => v.addEventListener(t, fn, o);
    on("mousemove", (e) => { last = e; sendMouse(2, e, 0, document.pointerLockElement ? e.movementX : 0, document.pointerLockElement ? e.movementY : 0); });
    on("mousedown", (e) => sendMouse(0, e));
    on("mouseup", (e) => sendMouse(1, e));
    on("wheel", (e) => { sendMouse(3, e, -e.deltaY / 3); e.preventDefault(); }, { passive: false });
    on("click", () => { v.focus(); if (!document.pointerLockElement) v.requestPointerLock?.(); });
    on("contextmenu", (e) => e.preventDefault());
    addEventListener("keydown", (e) => { if (player.classList.contains("on")) sendKey(e, true); });
    addEventListener("keyup", (e) => { if (player.classList.contains("on")) sendKey(e, false); });
    clearInterval(bindInput._h);
    bindInput._h = setInterval(() => { if (last && player.classList.contains("on") && !document.pointerLockElement) sendMouse(2, last); }, 300);
  }

  // ---- session + webrtc ----------------------------------------------
  const player = $("player");
  let ws = null, pc = null, uuid = null, busy = false;
  let iceServers = [], closing = false, signalTries = 0, readyTimer = null, iceTimer = null, iceGiveUp = null, SIG = null;
  const ICE_GIVE_UP_MS = 45000;
  const NO_PICTURE = "Unable to establish the game video connection. This network may restrict the required streaming ports.";
  // ---- our 443 relay -----------------------------------------------------------------
  // The picture is WebRTC through the provider's TURN server on port 8632 (UDP and TCP), the one part the /cloud
  // proxy cannot carry. A network that only allows 443 stalls on "Connecting the picture". Shasta's backend can run a
  // TURN-over-TLS front on 443 that forwards to that same TURN server (server/src/services/turnGate.ts); /cloud/relay
  // names it and which upstream it reaches. It is added as ONE MORE ICE server with the session's own per-session
  // credentials, after the provider's: ICE ranks a UDP relay above a TLS one, so a network where 8632 works keeps its
  // normal path and only a locked-down one ends up on 443. No relay configured = exactly the old behaviour.
  // ?ice=relay forces relayed candidates; ?ice=tls uses ONLY our 443 relay (what a UDP/8632-blocked network sees).
  const ICE_MODE = qs.get("ice") || "";
  let RELAYS = [];
  // The relay config lives on OUR host, so fetch it from our /cloud proxy even when the API itself is watching a
  // mirror: the picture is not proxyable, so the relay must be known no matter which way the control plane went.
  async function loadRelays() {
    const bases = [...new Set([API.base, ...PROXY_BASES].filter((b) => b && /\/cloud$/.test(b)))];
    for (const base of bases) {
      try {
        const r = await tfetch(`${base}/relay`, { cache: "no-store", credentials: "include" }, 4000);
        if (!r.ok) continue;
        const j = await r.json();
        const relays = Array.isArray(j && j.relays) ? j.relays.filter((x) => x && Array.isArray(x.urls) && x.upstream) : [];
        if (relays.length) return relays;
      } catch {}
    }
    return [];
  }
  const hostPort = (u) => { const m = /^(?:turns?|stuns?):([^?]+)/i.exec(String(u)); return m ? m[1].toLowerCase() : ""; };
  /** the provider's servers, then our relay for each TURN server it fronts (same username/credential) */
  function withRelays(servers, relays) {
    const out = servers.slice();
    const ours = [];
    for (const s of servers) {
      if (!s || !s.username) continue;
      const fronts = new Set([].concat(s.urls || []).map(hostPort));
      for (const r of relays) if (fronts.has(String(r.upstream).toLowerCase())) ours.push({ urls: r.urls, username: s.username, credential: s.credential });
    }
    if (ICE_MODE === "tls") return ours;
    return out.concat(ours);
  }
  const ourRelayHosts = () => new Set(RELAYS.flatMap((r) => r.urls.map(hostPort)));
  /** which server a candidate/error came from, without addresses: "443 relay", "upstream TURN", "STUN" */
  function serverKind(url) {
    const hp = hostPort(url);
    if (!hp) return "";
    if (ourRelayHosts().has(hp)) return "443 relay";
    return /^stuns?:/i.test(url) ? "STUN" : "upstream TURN";
  }

  // ---- media-path diagnostics --------------------------------------------------------
  // A school Chromebook cannot open devtools inside Shasta, so the page reports where the WebRTC media leg fails:
  // which candidates it gathered (and over which transport it reached each TURN server), ICE errors per server, the
  // ICE/gathering/connection states, the selected pair, and a plain verdict. Read-only: it never changes the path.
  // No addresses, ports of the visitor, credentials or session ids are kept: only counts, states and server kinds.
  const diag = { startedAt: 0, gathering: "new", ice: "new", conn: "new", local: {}, remote: 0, pair: null, errors: [], connectedMs: 0 };
  const bump = (o, k) => { o[k] = (o[k] || 0) + 1; };
  const stamp = () => new Date().toISOString().replace("T", " ").slice(0, 19);
  const noteErr = (t) => { if (!diag.errors.includes(t) && diag.errors.length < 12) diag.errors.push(t); };
  let diagStats = null;
  const candKey = (type, relayProtocol, url) => (type === "relay" ? `relay/${relayProtocol || "?"}${url ? ` (${serverKind(url)})` : ""}` : type || "unknown");
  async function pollStats() {
    if (!pc || pc.signalingState === "closed") return;
    let rep; try { rep = await pc.getStats(); } catch { return; }
    const byId = new Map();
    let pairId = null;
    const local = {};
    let remote = 0;
    rep.forEach((s) => {
      byId.set(s.id, s);
      if (s.type === "transport" && s.selectedCandidatePairId) pairId = s.selectedCandidatePairId;
      if (s.type === "local-candidate") bump(local, candKey(s.candidateType, s.relayProtocol, s.url));
      if (s.type === "remote-candidate") remote++;
    });
    // tallied fresh from each full report, so the numbers never grow by themselves
    if (Object.keys(local).length) diag.local = local;
    diag.remote = remote;
    let pair = pairId && byId.get(pairId);
    if (!pair) rep.forEach((s) => { if (s.type === "candidate-pair" && s.state === "succeeded" && (s.selected || s.nominated)) pair = s; });
    if (pair && pair.state === "succeeded") {
      const l = byId.get(pair.localCandidateId), r = byId.get(pair.remoteCandidateId);
      diag.pair = {
        local: l ? candKey(l.candidateType, l.relayProtocol, l.url) : "?",
        remote: (r && r.candidateType) || "?",
        rtt: pair.currentRoundTripTime,
        inKbps: diag.pair && pair.bytesReceived != null && diag.pair.bytes != null ? Math.round(((pair.bytesReceived - diag.pair.bytes) * 8) / 2000) : null,
        bytes: pair.bytesReceived,
      };
    }
    renderDiag();
  }
  function verdict() {
    const L = diag.local;
    const keys = Object.keys(L);
    const relays = keys.filter((k) => k.startsWith("relay/"));
    const srflx = L.srflx || 0;
    const errs = diag.errors.join(" ");
    if (diag.conn === "connected" || diag.ice === "connected" || diag.ice === "completed")
      return { ok: true, text: `media path up${diag.pair ? ` via ${diag.pair.local}` : ""}${diag.connectedMs ? ` after ${(diag.connectedMs / 1000).toFixed(1)} s` : ""}` };
    const viaOurs = relays.some((k) => k.includes("443 relay"));
    const viaUp = relays.some((k) => k.includes("upstream"));
    if (!relays.length && !srflx) return { ok: false, text: `no STUN or TURN server answered: this network blocks outbound UDP and the game's TURN port (8632)${RELAYS.length ? ", and our 443 relay did not answer either" : ""}.` };
    if (!relays.length) return { ok: false, text: `STUN answered but no TURN server did: the game's TURN server (port 8632) is blocked here${RELAYS.length ? " and our 443 relay did not answer" : " and no 443 relay is configured"}.` };
    if (!diag.remote) return { ok: false, text: "a relay was reached but the gaming PC's candidates never arrived (signalling)." };
    if (diag.ice === "failed") return { ok: false, text: `relay reached (${relays.join(", ")}) but ICE failed: the relay could not reach the gaming PC.` };
    if (!viaUp && viaOurs) return { ok: false, text: `only our 443 relay is reachable; still checking (${diag.ice}).` };
    return { ok: false, text: `relay reached (${relays.join(", ")}); still checking (${diag.ice})${/701/.test(errs) ? ". Some servers did not answer, see errors" : ""}.` };
  }
  function snapshot() {
    const v = verdict();
    return { at: stamp(), ms: diag.startedAt ? Date.now() - diag.startedAt : 0, verdict: v.text, ok: v.ok, iceMode: ICE_MODE || "normal", relays443: RELAYS.length, iceGatheringState: diag.gathering, iceConnectionState: diag.ice, connectionState: diag.conn, localCandidates: diag.local, remoteCandidates: diag.remote, selectedPair: diag.pair && { local: diag.pair.local, remote: diag.pair.remote, rttMs: diag.pair.rtt != null ? Math.round(diag.pair.rtt * 1000) : null, inKbps: diag.pair.inKbps }, errors: diag.errors, via: API.base ? "shasta proxy" : "mirror", ua: navigator.userAgent };
  }
  function renderDiag() {
    const el = $("diag");
    if (!el || !el.classList.contains("on")) return;
    const v = verdict();
    const cand = (o) => Object.entries(o).map(([k, n]) => `${k}:${n}`).join("  ") || "none";
    el.replaceChildren();
    const h = document.createElement("h4");
    h.className = v.ok ? "good" : "bad";
    h.textContent = "Media path";
    const sp = document.createElement("span"); sp.style.flex = "1";
    const copy = document.createElement("button"); copy.className = "btn"; copy.textContent = "Copy";
    copy.onclick = () => navigator.clipboard?.writeText(JSON.stringify(snapshot(), null, 2)).then(() => { copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 1500); }, () => { copy.textContent = "Select & copy"; });
    const hide = document.createElement("button"); hide.className = "btn"; hide.textContent = "Hide";
    hide.onclick = () => el.classList.remove("on");
    h.append(sp, copy, hide);
    const mk = (k, val, bad) => { const d = document.createElement("div"); const a = document.createElement("span"); a.className = "k"; a.textContent = k + ": "; const b = document.createElement("span"); b.className = bad ? "bad" : "v"; b.textContent = val; d.append(a, b); return d; };
    const p = diag.pair;
    el.append(
      h,
      mk("mode", `${ICE_MODE || "normal"} · 443 relay ${RELAYS.length ? "available" : "not configured"}`),
      mk("local candidates", cand(diag.local)),
      mk("remote candidates", String(diag.remote)),
      mk("gathering / ice / connection", `${diag.gathering} / ${diag.ice} / ${diag.conn}`, diag.ice === "failed" || diag.conn === "failed"),
      mk("selected", p ? `${p.local} to ${p.remote}${p.rtt != null ? ` · ${Math.round(p.rtt * 1000)} ms` : ""}${p.inKbps != null ? ` · ${p.inKbps} kbit/s` : ""}` : "none"),
    );
    if (diag.errors.length) el.append(mk("errors", diag.errors.join(" | "), true));
    el.append(mk("verdict", v.text, !v.ok));
  }
  const showDiag = () => { const el = $("diag"); if (el) { el.classList.add("on"); renderDiag(); } };
  window.__opiumDiag = () => JSON.stringify(snapshot(), null, 2);

  const sub = (t) => { $("psub").textContent = t; };
  let lastStart = null;
  // an error always comes with a way out: Retry starts the same game again from a fresh relay pick
  const fail = (m) => {
    const box = $("pmsg");
    box.replaceChildren();
    const err = document.createElement("span"); err.className = "err"; err.textContent = m;
    const again = document.createElement("button"); again.className = "btn"; again.textContent = "Try again"; again.style.marginTop = "12px";
    again.onclick = () => { if (busy || !lastStart) return; teardownQuiet(); HOST = qs.get("h") || null; start(...lastStart); };
    box.append(err, document.createElement("br"), again);
    $("overlay").classList.remove("gone");
    showDiag();
  };
  const clock = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s % 60)).padStart(2, "0")}`;
  const phase = (m) => { $("pmsg").innerHTML = `<span class="spin"></span><div style="margin-top:8px;color:#9aa0ad;font-size:13px">${m}</div>`; $("overlay").classList.remove("gone"); };

  // The relay 502s/timeouts while an instance is still attaching, so a socket that dies before
  // game_ready (or after) is retried instead of failing the launch.
  // The provider keeps ONE signalling socket per session: opening a new one kicks the old one (close 1006). So every
  // handler is bound to its own socket and ignores events once it is no longer the current one; otherwise the kicked
  // socket's onclose started yet another reconnect, which kicked the new socket, forever (seen 2026-11-01 when the
  // media path dropped: a new socket every ~1.2 s, the counter reset by each game_ready, never recovering).
  function openSignal() {
    const url = SIG || `${apiBase().replace(/^http/, "ws")}/${V1 ? "cloud/v1" : "stratus"}/signal/${uuid}`;
    const sock = new WebSocket(url);
    ws = sock;
    clearTimeout(readyTimer);
    readyTimer = setTimeout(() => { if (ws === sock && sock.readyState === 1) { try { sock.close(); } catch {} } }, 12000);
    sock.onmessage = async (ev) => {
      if (ws !== sock) return;
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "game_ready") { clearTimeout(readyTimer); signalTries = 0; if (!pc) await negotiate(iceServers); }
      else if (m.type === "rtc_answer") await pc?.setRemoteDescription(m.sdp).catch(() => {});
      else if (m.type === "rtc_candidate") await pc?.addIceCandidate(m.candidate).catch(() => {});
      else if (m.type === "ping") { clearTimeout(readyTimer); if (sock.readyState === 1) sock.send(JSON.stringify({ type: "ping" })); }
      // the cloud's play-time limit for this session, not a loading time
      else if (m.type === "time_left") sub(`Play time left ${clock(m.time_left)}`);
      else if (m.type === "game_cap") end("time is up", m.message);
      else if (m.type === "game_ended") end("session ended", m.message);
    };
    sock.onerror = () => {};
    sock.onclose = () => { if (ws === sock && !closing && uuid) reconnect(); };
  }

  /** drop the current socket without it triggering anything (its handlers check `ws === sock`) */
  function dropSignal() {
    const old = ws;
    ws = null;
    if (old) { old.onclose = old.onmessage = null; try { old.close(); } catch {} }
  }

  let reconnecting = false, mediaFails = 0;
  const mediaUp = () => !!pc && ["connected", "completed"].includes(pc.iceConnectionState);
  // A session negotiates its picture ONCE: the gaming PC never answers a second rtc_offer (measured 2026-11-01, also on
  // a fresh socket). So a lost signalling socket is reopened without touching a working picture, while a picture that
  // failed (or an offer that went unanswered) needs a fresh session: quit, then start the same game again.
  async function reconnect() {
    if (closing || !uuid || busy || reconnecting) return;
    if (pc && !mediaUp()) return restartSession();
    // signalTries counts sockets that die (before game_ready, or under a running picture)
    if (signalTries++ > 10) return fail("lost the connection to the cloud server");
    reconnecting = true;
    if (!pc) phase(`reconnecting… (${signalTries})`);
    dropSignal();
    await new Promise((r) => setTimeout(r, Math.min(800 * signalTries, 4000)));
    reconnecting = false;
    if (closing) return;
    openSignal();
  }
  /** the picture is gone for good in this session: start a new one, twice at most, then say so */
  function restartSession() {
    if (!lastStart) return;
    if (++mediaFails > 2) { fail(NO_PICTURE); teardownQuiet(); return; }
    teardownQuiet();
    start(lastStart[0], lastStart[1], lastStart[2], true);
    sub("the picture dropped, starting again…");
  }

  async function start(key, name, cover, again = false) {
    if (busy || !key) return;
    busy = true;
    player.classList.add("on", "showbar");
    $("pname").textContent = name || key; $("pbar").textContent = name || key;
    $("pcover").src = cover || "";
    $("pcover").style.display = cover ? "" : "none";
    closing = false; signalTries = 0; reconnecting = false; if (!again) mediaFails = 0; sub(""); phase("Finding a cloud server…");
    lastStart = [key, name, cover];
    try {
      if (!API.base) {
        await ensureApi();
        if (!API.base) {
          try { await pickHost(); } catch { return fail(UNREACHABLE); }
        }
      }
      phase("Asking for a gaming PC…");
      if (challengeHost) sub("passing this network's security check…");
      // session creation is retried (the pool drops requests while it respawns machines), then moved to the next relay
      let o = null;
      for (let i = 0; i < 6 && (!o || o.error); i++) {
        o = await createSession(key).catch(() => null);
        if (o && !o.error) break;
        if (i % 2 === 1 && !nextHost()) break;
        await new Promise((r) => setTimeout(r, 1200));
      }
      if (!o || o.error) return fail((o && o.error) || "No gaming PC is free right now. Try again in a minute.");
      uuid = o.uuid;
      while (o.state === "queued") {
        phase(`Waiting for a free PC · you are #${o.queue_pos ?? "?"} in line`);
        await new Promise((r) => setTimeout(r, V1 ? 3200 : 2000));
        o = await pollSession(uuid).catch(() => ({}));
      }
      phase("Starting the game on the PC…");
      let st = null;
      for (let i = 0; i < 3 && (!st || st.error); i++) {
        st = await startSession(uuid).catch(() => null);
        if (!st || st.error) await new Promise((r) => setTimeout(r, 1500));
      }
      if (!st || st.error) return fail((st && st.error) || "The gaming PC did not start. Try again.");
      RELAYS = await loadRelays();
      iceServers = withRelays(st.ice_servers || [], RELAYS);
      SIG = signalUrl(uuid, st);
      openSignal();
    } catch (e) { fail(/timeout|abort/i.test(String(e && e.name)) ? UNREACHABLE : String(e.message || e)); }
    finally { busy = false; }
  }

  async function negotiate(servers) {
    if (pc) return;
    phase("Connecting the picture…");
    // the picture is plain WebRTC, which the /cloud proxy cannot carry: this is where a network that allows
    // our host but blocks the game's TURN server (port 8632) stalls. Say so instead of "connecting…" forever.
    clearTimeout(iceTimer);
    iceTimer = setTimeout(() => { sub("the picture is taking a while — this network may block the video stream"); showDiag(); }, 12000);
    // a hard limit so a blocked network ends in an answer and a way out instead of a spinner
    clearTimeout(iceGiveUp);
    iceGiveUp = setTimeout(() => {
      if (!pc || ["connected", "completed"].includes(pc.iceConnectionState)) return;
      noteErr(`no media path after ${ICE_GIVE_UP_MS / 1000} s`);
      fail(NO_PICTURE);
      teardownQuiet(); // free the gaming PC; the diagnostics keep their last reading for "Copy"
    }, ICE_GIVE_UP_MS);
    diag.startedAt = Date.now(); diag.local = {}; diag.remote = 0; diag.pair = null; diag.errors = []; diag.gathering = "new"; diag.ice = "new"; diag.conn = "new"; diag.connectedMs = 0;
    if (ICE_MODE === "tls" && !(servers || []).length) noteErr("?ice=tls but no 443 relay is configured for this server");
    pc = new RTCPeerConnection({ iceServers: servers || [], bundlePolicy: "max-bundle", rtcpMuxPolicy: "require", iceTransportPolicy: ICE_MODE ? "relay" : "all" });
    // 701 = that server never answered (blocked port), 401 = credentials refused, etc. Kept without addresses.
    const me = pc; // events from a peer connection that was replaced are ignored
    pc.onicecandidateerror = (e) => { if (me !== pc) return; const k = serverKind(e.url); if (k) noteErr(`${k}: ${e.errorCode}${e.errorText ? " " + String(e.errorText).slice(0, 60) : ""}`); renderDiag(); };
    pc.addTransceiver("audio", { direction: "recvonly" });
    const v = pc.addTransceiver("video", { direction: "recvonly" });
    try {
      const caps = RTCRtpReceiver.getCapabilities("video");
      if (caps) {
        const h264 = caps.codecs.filter((c) => /h264/i.test(c.mimeType));
        const av1 = caps.codecs.filter((c) => /av1/i.test(c.mimeType));
        const rest = caps.codecs.filter((c) => !/h264|av1/i.test(c.mimeType));
        v.setCodecPreferences([...h264, ...av1, ...rest]);
      }
    } catch {}
    const stream = new MediaStream();
    pc.ontrack = (e) => { if (me !== pc) return; stream.addTrack(e.track); $("video").srcObject = stream; $("video").play().catch(() => {}); };
    pc.onicecandidate = (e) => { if (me !== pc) return; if (e.candidate) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "rtc_candidate", candidate: e.candidate.toJSON() })); } };
    pc.onicegatheringstatechange = () => { if (me !== pc) return; diag.gathering = pc.iceGatheringState; renderDiag(); };
    pc.oniceconnectionstatechange = () => { if (me !== pc) return; diag.ice = pc.iceConnectionState; if (pc.iceConnectionState === "failed") { diag.errors.push(`ice failed at ${stamp()}`); showDiag(); } renderDiag(); };
    pc.onsignalingstatechange = () => renderDiag();
    pc.onconnectionstatechange = () => {
      if (me !== pc) return;
      diag.conn = pc.connectionState;
      if (pc && ["connected", "completed"].includes(pc.iceConnectionState)) { if (!diag.connectedMs) diag.connectedMs = Date.now() - diag.startedAt; clearTimeout(iceTimer); clearTimeout(iceGiveUp); mediaFails = 0; signalTries = 0; sub(""); $("overlay").classList.add("gone"); $("hint").textContent = "click for pointer lock · Esc to release"; }
      if (pc && pc.connectionState === "failed") {
        noteErr(`connection failed at ${stamp()}`);
        restartSession();
      }
      renderDiag();
    };
    clearInterval(diagStats);
    diagStats = setInterval(pollStats, 2000);
    pollStats();

    dc = pc.createDataChannel("JYSDK", { id: 1, ordered: false, maxRetransmits: 0, priority: "high" });
    dc.onopen = () => bindInput();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    if (me !== pc || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "rtc_offer", sdp: offer.sdp }));
  }

  function end(reason, msg) { fail(`${reason}${msg ? " — " + msg : ""}`); setTimeout(teardown, 1500); }
  /** ends the current attempt (session, socket, stream) but keeps the player on screen, for "Try again" */
  function teardownQuiet() {
    closing = true; clearTimeout(readyTimer); clearTimeout(iceTimer); clearTimeout(iceGiveUp); clearInterval(diagStats);
    try { dc?.close(); } catch {}
    try { pc?.close(); } catch {}
    dropSignal();
    if (uuid) quitSession(uuid);
    dc = pc = ws = uuid = null; SIG = null;
  }
  function teardown() {
    closing = true; clearTimeout(readyTimer); clearTimeout(iceTimer); clearTimeout(iceGiveUp); clearInterval(diagStats);
    try { dc?.close(); } catch {}
    try { pc?.close(); } catch {}
    dropSignal();
    if (uuid) quitSession(uuid);
    dc = pc = ws = uuid = null; SIG = null;
    document.exitPointerLock?.();
    player.classList.remove("on");
    $("diag").classList.remove("on");
    if (!cfg) phase("");
    else phase("starting…");
    $("overlay").classList.remove("gone");
  }

  // ---- wiring ---------------------------------------------------------
  $("q").addEventListener("input", (e) => render(e.target.value));
  $("pfull").addEventListener("click", () => (document.fullscreenElement ? document.exitFullscreen() : player.requestFullscreen?.().catch(() => {})));
  $("diagbtn").addEventListener("click", () => { const el = $("diag"); el.classList.toggle("on"); renderDiag(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape" && player.classList.contains("on") && !document.pointerLockElement) { /* let Esc free the pointer first */ } });
  addEventListener("pagehide", () => { if (uuid) teardown(); });

  loadCatalog().catch((e) => { $("status").textContent = e.message === "unreachable" ? UNREACHABLE : "could not load the catalogue: " + e.message; });
})();
</script>
</body>
</html>
