<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>now.gg</title>
<!--
  now.gg player — small, self-contained, no build step.
  Baked into one Store package per game (`window.__NOWGG__` = {appId,name,cover}); auto-plays that game.
  Also works standalone: /nowgg.html?g=<appId>&n=<name>.
  Control plane goes to `window.__NOWGG_PROXY__` (baked: the site's /nowgg proxy) or same-origin /nowgg.
  Protocol recovered from now.gg's own bundle; see ../nowgg-recon/README.md and docs/nowgg.md.

  Staying in the game (docs/nowgg.md "Long sessions"): a box is reclaimed every few minutes, so a
  handoff is the normal case, not an error. During one the last picture stays on screen (#freeze)
  with a small status pill; the full card only shows before the first picture or when it needs you.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #e7e7ef; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #v, #freeze { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; touch-action: none; }
  #freeze { pointer-events: none; z-index: 1; }
  #freeze[hidden] { display: none; }
  #bg { position: fixed; inset: -40px; background: #000 center / cover no-repeat; filter: blur(28px) brightness(.45); z-index: 2; pointer-events: none; transition: opacity .4s; }
  #bg.gone { opacity: 0; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 5; pointer-events: none; white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #9fe8ff; background: rgba(0, 0, 0, .55); padding: 3px 7px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
  #hud.on { opacity: 1; }
  #overlay { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #overlay.hidden { display: none; }
  #overlay .box { pointer-events: auto; background: rgba(8, 9, 14, .86); border: 1px solid #23263a; border-radius: 14px; padding: 18px 22px; max-width: 460px; margin: 0 16px; box-shadow: 0 18px 60px #000a; }
  #overlay .name { font-size: 17px; font-weight: 600; }
  #overlay .msg { color: #a9aec0; margin-top: 6px; min-height: 1.4em; }
  .spin { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid #fff3; border-top-color: #fff; border-radius: 50%; vertical-align: -2px; animation: sp .8s linear infinite; }
  #overlay .spin { width: 18px; height: 18px; vertical-align: -3px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  button { pointer-events: auto; margin-top: 12px; padding: 8px 14px; background: #1b1b26; color: #e7e7ef; border: 1px solid #2c2c3e; border-radius: 9px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #24243a; }
  button.primary { background: #e7e7ef; color: #0b0b12; border-color: #e7e7ef; }
  button.primary:hover { background: #fff; }
  #ovbtns { display: flex; gap: 8px; justify-content: center; }
  #ovbtns button[hidden] { display: none; }
  #pill { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5; max-width: calc(100% - 32px); pointer-events: none; padding: 7px 13px; border-radius: 999px; background: rgba(8, 9, 14, .82); border: 1px solid #23263a; font-size: 12.5px; color: #d8dbe8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .25s; }
  #pill.hidden { opacity: 0; }
  #bar { position: fixed; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  #bar.on { opacity: 1; }
  #bar button { margin: 0; padding: 6px 11px; font-size: 12px; background: rgba(16, 17, 26, .8); }
  #sound { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 6; margin: 0; padding: 7px 14px; font-size: 12.5px; background: rgba(16, 17, 26, .9); }
  #sound[hidden] { display: none; }
  #log { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; max-height: 40%; margin: 0; overflow: auto; padding: 8px 12px; font: 11px/1.45 ui-monospace, monospace; color: #9a9ab8; background: rgba(4, 5, 10, .92); border-top: 1px solid #1b1b26; white-space: pre-wrap; }
  #log[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<canvas id="freeze" hidden></canvas>
<div id="bg"></div>
<div id="hud"></div>
<div id="bar"><button id="mute">Mute</button><button id="fs">Fullscreen</button><button id="det">Details</button></div>
<button id="sound" hidden>Click for sound</button>
<div id="pill" class="hidden"></div>
<div id="overlay"><div class="box">
  <div class="name" id="ovname">now.gg</div>
  <div class="msg" id="ovtext"><span class="spin"></span>Starting…</div>
  <div id="ovbtns"><button id="ovkeep" class="primary" hidden>Keep playing</button><button id="ovretry" hidden>Retry</button></div>
</div></div>
<pre id="log" hidden></pre>

<script>
// Baked config for a package build; null when this is the browsable page.
window.__NOWGG__ = /*__CONFIG__*/null;
// The site's /nowgg proxy (baked into a package). null/empty = same-origin /nowgg.
window.__NOWGG_PROXY__ = /*__PROXY__*/null;
</script>
<script>
(() => {
"use strict";
/* ---- config ---- */
const qs = new URLSearchParams(location.search);
const cfg = window.__NOWGG__ || (qs.get("g") ? { appId: qs.get("g"), name: qs.get("n") || "", cover: qs.get("c") || "" } : null);
// The proxy: the baked one (the main site's, set at import) unless the Shasta window that opened this game names
// its own domain's (store/AppLauncher.tsx answers `nowgg:proxy?`), so a filter blocking the main domain does not
// break games for someone on pages.dev or a Lite mirror. Only our own domains are accepted (the guest token goes there).
const BAKED_API = (window.__NOWGG_PROXY__ || "/nowgg").replace(/\/+$/, "");

const OUR_HOSTS = /^(https:\/\/((www\.)?edushasta\.lol|([a-z0-9-]+\.)?shasta-dtg\.pages\.dev|shasta-lite\.vercel\.app|shasta-lte\.base44\.app|shasta-lite-395c5527\.base44\.app)|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)$/;

const FE = "berlin-v1.54.400-arm.5";
const ALPHA = "useandom26T198340PX75pxJACKVERYMINDBUSHWOLFxGQZbfghjklqvwyzrict"; // no "_" (405s server-side)

let APP = cfg ? String(cfg.appId) : null;

/* ---- tiny dom/helpers ---- */
const $ = (id) => document.getElementById(id);
const video = $("v"), freezeCv = $("freeze");
const ts = () => new Date().toISOString().slice(11, 23);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const hud = (t) => { $("hud").textContent = t; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---- what the person sees ----
 * card(): the centred card — before the first picture, and whenever the person has to act.
 * status(): during play (a picture has been shown), a small pill over the frozen last frame, so a
 * box handoff reads as a short pause instead of a reload. */
let hadPicture = false;
const card = (html, { spin = false, retry = false, keep = false } = {}) => {
  $("ovtext").innerHTML = (spin ? '<span class="spin"></span>' : "") + html;
  $("ovretry").hidden = !retry; $("ovkeep").hidden = !keep;
  $("overlay").classList.remove("hidden"); $("pill").classList.add("hidden");
};

const status = (html) => {
  if (!hadPicture) return card(html, { spin: true });
  $("pill").innerHTML = '<span class="spin"></span>' + html; $("pill").classList.remove("hidden");
};
const clearStatus = () => { $("pill").classList.add("hidden"); };

/* Keep the last picture on screen while the stream is swapped. */
let frozenAt = 0;

  if (!freezeCv.hidden) return;

  if (freezeCv.hidden) return;

}
// The first decoded frame of a new stream ends the freeze and the status pill.
function onFirstFrame() {
  const done = () => { hadPicture = true; unfreeze(); clearStatus(); hideCard(); $("bg").classList.add("gone"); };
  if (typeof video.requestVideoFrameCallback === "function") video.requestVideoFrameCallback(done);
  else video.addEventListener("playing", done, { once: true });
}

/* ---- identity + guest token, kept on this device so we reattach to the same box ----
 * The session is keyed to the now.gg account (the guest token), NOT the uaId, so the token
 * must persist per origin. Bearer-only: no cookies are needed (verified against the live API). */

/* ---- request layer ---- */

  sent: 0, drops: 0, vpn: false, hunt: false, tries: 0, failSince: 0, handoffs: 0, lastHandoff: null, playedMs: 0, playingSince: 0, calls: 0 };

/* ---- /oapi/<n> is PER APP and rotates; wrong prefix => empty 205. Remember the good one. ----
 * No page fetch to guess it (that was ~190 KB through the proxy per first play): a 205 is cheap,
 * so we just try the next prefix at once. */
const PREFIXES = ["/oapi/2", "/oapi/1", "/oapi/3"];

function sessionParams(extra = {}) {
  return { appId: APP, uaId: id.uaId, uaSessionId: id.uaSessionId, feSessionId: id.feSessionId, visitId: id.visitId,
    initialOrientation: "landscape", utmSource: "NA", utmMedium: "NA", utmCampaign: "NA", deepLinkUrl: "", accessCode: "",
    ngReferrer: "NA", pageReferrer: "NA", ngEntryPoint: "NA", ntmSource: "NA", customData: "NA",
    appLaunchExtraData: "NA", launcherData: "NA", feSessionTags: "", membershipId: "", sdpType: "", isIframe: "false",

}

  .replace(/useinbandfec=1/g, "sprop-stereo=1;stereo=1;maxplaybackrate=48000")
  .replace(/minptime=(\d*);/g, "minptime=3;ptime=3;maxptime=20;");

const START_POLICY = { WaitingInQueue: 3000, WaitingInPriorityQueue: 3000, FailureTryAgain: 1500, FailureRetryStartSessionLater: 3000,
  FailureAnotherSessionActive: 2000, FailureSessionMigrated: 1500, FailureNoResource: 5000, FailureInsufficientInstanceCapacity: 5000,
  FailureUserStorageBusy: 1000, FailureNotReady: 3000 };

const AUTH_FAIL = ["FailureUnauthorized", "FailureInvalidPlayUser", "FailureTokenExpired", "FailureInvalidToken"];

/* now.gg picks a machine for the session and sometimes ends it right away because that machine serves
 * another region (FailureServiceNotInRegion) — the client just starts another. Nothing is wrong here, it
 * is now.gg choosing a host near the player, so say that instead of showing it as a dropped session. */
const HUNT = /Failure.*(Region|NoResource|InsufficientInstanceCapacity|NotReady|UserStorageBusy|RetryStartSessionLater)/;

/* ---- auth ---- */
async function doAuth(force = false) {
  if (!force && token && state.playUserToken) return;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (!token || force) {

      if (!tok.access_token) throw new Error("no token: " + JSON.stringify(tok).slice(0, 160));
      setToken(tok.access_token); force = false;
    }
    log("<b>createPlayUser</b>");
    const pu = await call(oapiPrefix + "/play/v1/createPlayUser", { method: "POST", body: { uaId: id.uaId } });
    if (pu._http === 205) { oapiPrefix = PREFIXES[(PREFIXES.indexOf(oapiPrefix) + 1) % PREFIXES.length]; log("  prefix -> " + oapiPrefix); continue; }
    if (pu.status === "FailureUaIdRevoked") { log("  uaId revoked -> new identity"); resetIdentity(); continue; }

const startMsg = (st) => st === "FailureUserStorageBusy" ? "now.gg is moving the game to a new machine…"
  : st === "FailureNotReady" ? "Machine is booting…"
  : (st === "FailureNoResource" || st === "FailureInsufficientInstanceCapacity") ? "Waiting for a free machine…" : "In the queue…";

    if (s.status === "Success") break;

  // hovering counts as being here (moves without a button are not sent to the machine)
  document.addEventListener("pointermove", touchActivity, { passive: true });
}

/* ---- establish (re-runnable) ---- */
let timers = [], wired = false, reconnecting = false, reconnectQueued = false;
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };

// one owner per account: a second tab of the same game shares the token -> same box. Park it.
const TAB = nanoid(8);
const bc = typeof BroadcastChannel === "function" ? new BroadcastChannel("nowgg-session:" + APP) : null;
function stopPlaying() { pausePlayClock(); state.stopping = true; reconnecting = false; reconnectQueued = false; clearTimers(); releaseAll(); try { state.pc?.close(); } catch {} state.pc = state.dc = null; releaseWake(); }
function park(html) { stopPlaying(); unfreeze(); offerRetry(html); log("<b>parked</b>"); }
if (bc) bc.onmessage = (e) => { if (e.data?.type === "claim" && e.data.tab !== TAB && !state.stopping && (state.pc || reconnecting)) park("<b>Playing in another tab</b><br>Retry to play here instead."); };
const claim = () => { try { bc?.postMessage({ type: "claim", tab: TAB }); } catch {} };

let lastTakeover = 0;
function onTakeover(reason) {
  const now = Date.now();
  if (now - lastTakeover < 60000) { lastTakeover = 0; return park("<b>Session opened elsewhere</b><br>Another tab or device is using it.<br>Retry to take it back."); }
  lastTakeover = now; scheduleReconnect(reason);
}

async function establish() {
  clearTimers();
  try { state.pc?.close(); } catch {} state.pc = state.dc = null;
  const s = await beginSession();
  if (state.stopping) return;

  status(hadPicture ? "Reconnecting the picture…" : "Connecting the picture…"); log("<b>webrtc</b>");
  const pc = new RTCPeerConnection({ iceServers: (s.iceServers || s.iceServersList || []).map((x) => ({ urls: x.urls || x.url, username: x.username, credential: x.credential })) });
  state.pc = pc;
  const remote = new MediaStream();
  pc.ontrack = (e) => {
    if (pc !== state.pc) return;
    remote.addTrack(e.track);
    if (video.srcObject !== remote) { video.srcObject = remote; onFirstFrame(); }
    playVideo(); log("<b>track</b> " + e.track.kind);
  };
  pc.onconnectionstatechange = () => {
    if (pc !== state.pc) return; log("  pc=" + pc.connectionState);
    if (pc.connectionState === "failed") scheduleReconnect("pc-failed");
    if (pc.connectionState === "connected") { reconnecting = false; resumePlayClock(); }
  };
  pc.ondatachannel = (e) => {
    const ch = e.channel; if (/file/i.test(ch.label)) return;
    ch.binaryType = "arraybuffer"; state.dc = ch; log("<b>datachannel</b> " + ch.label);
    ch.onopen = () => { state.sizeSent = null; sendScreenSize(); sendFrame(1, [0, 0, 0]); setTimeout(() => sendFrame(2, [0, 0, 0]), 50); };
    ch.onmessage = (ev) => {
      if (ch !== state.dc) return;
      const str = typeof ev.data === "string" ? ev.data : new TextDecoder().decode(ev.data);
      const m = {}; for (const p of str.split(":::")) { const i = p.indexOf("="); if (i > 0) m[p.slice(0, i)] = p.slice(i + 1); }
      onMessage(m.msgType || "?", m, ch, pc);
    };
  };
  if (!wired) { wireInput(); wired = true; }

  await pc.setRemoteDescription({ type: "offer", sdp: s.offerSdp });
  for (const c of s.iceCandidates || []) await pc.addIceCandidate({ candidate: c.candidate || c, sdpMid: c.sdpMid, sdpMLineIndex: c.sdpMLineIndex }).catch(() => {});
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  // now.gg's own client answers straight away (the remote side learns our candidates from its
  // connectivity checks), so no ICE-gathering wait: that alone took 1.5 s off every handoff.
  if (state.stopping || pc !== state.pc) { try { pc.close(); } catch {} return; }
  const set = await call(oapiPrefix + "/play/v1/setAnswerSdp", { method: "POST", body: { ...sessionParams(), answerSdp: munge(pc.localDescription?.sdp || ans.sdp) } });
  log("  setAnswerSdp=" + (set.status || ("http " + set._http)));
  pc.__answeredAt = Date.now(); pc.__answerOk = set.status === "Success";
  if (set.status === "FailureSessionMigrated") { pc.__answeredAt = 0; onTakeover("Migrated"); }
  else if (set.status !== "Success") { pc.__answeredAt = 0; scheduleReconnect("answer-" + (set.status || set._http), set.status === "FailureRetryStartSessionLater" ? 10000 : 1500); }

  // tiny keepalive on the data channel (never touches our server)
  timers.push(setInterval(() => dcSend("osd::0"), 10000));
  startHud(pc); startWatchdog(pc);
}

/* ---- messages from the machine ---- */
let idleAsk = null;
function onMessage(t, m, ch, pc) {
  if (t === "androidReady") {
    state.stream = { w: +m.streamingWidth || 0, h: +m.streamingHeight || 0 };
    ch.send("osd::0"); ch.send("showtouches::" + (state.showTouches ? "1" : "0")); ch.send("screen::orientation::" + (screen.orientation?.type || "landscape-primary"));
    ch.send("tabstatus::" + (document.visibilityState === "visible" ? "active" : "inactive"));
    state.sizeSent = null; sendScreenSize(); log("<b>androidReady</b> " + state.stream.w + "x" + state.stream.h);
  }
  else if (t === "sessionComplete") onSessionComplete(m);
  else if (t === "sessionMigrated" || m.sessionMigrated) setTimeout(() => { if (pc === state.pc && !(state.dc?.readyState === "open" && pc.connectionState === "connected")) onTakeover("Migrated"); }, 900);
  else if (t === "keyboardStatus") state.kb = m.enabled === "true" || m.enabled === true;
  else if (t === "noUserActivity") onIdle(null);
  else if (t === "showDisconnectTimer") onIdle(+m.graceIntervalSecs || 59, m.reason);
  else if (t === "discardDisconnectTimer") endIdleAsk();
  else if (t === "appcrash_fatal") { log("<b>app crashed</b> on the machine"); scheduleReconnect("appcrash"); }
  // The GAME asked for an ad (its own "watch an ad for coins"). We show none, so tell it the ad
  // could not load, exactly like now.gg's client does when no ad is available — otherwise the game
  // sits waiting for an ad that never comes.
  else if (t === "ADS::showRewardedVideoAd") { dcSend("ADS::rewardedAdLoad::fail" + (m["sdk-type"] ? "::" + m["sdk-type"] : "")); log("  game asked for a rewarded ad -> none available"); }
  else if (t === "ADS::showInterstitialAd") { dcSend("ADS::interstitialAdLoad::fail" + (m["sdk-type"] ? "::" + m["sdk-type"] : "")); log("  game asked for an ad -> none available"); }
}

/* Idle: the machine only sees clicks and keys, so someone watching a cutscene or steering with
 * the mouse hovering looks idle to it. If the person did anything here in the last 2 minutes
 * and the tab is in view, they are here: answer for them. Otherwise ask, with the countdown. */
const PRESENT_MS = 120000;
function onIdle(secs, reason) {
  const present = document.visibilityState === "visible" && Date.now() - lastLocalInput < PRESENT_MS;
  log("<b>" + (secs ? "disconnect timer " + secs + "s" : "noUserActivity") + "</b>" + (reason ? " " + esc(reason) : "") + (present ? " -> still here, continuing" : ""));
  if (present) return keepPlaying();
  if (idleAsk) return;
  const until = Date.now() + (secs || 60) * 1000;
  const draw = () => {
    const left = Math.max(0, Math.round((until - Date.now()) / 1000));
    card("<b>Still playing?</b><br>The game stops in " + left + "s if nothing happens.", { keep: true });
  };
  draw(); idleAsk = setInterval(draw, 1000);
  const back = () => { if (idleAsk) keepPlaying(); };
  window.addEventListener("keydown", back, { once: true }); video.addEventListener("pointerdown", back, { once: true });
}
function keepPlaying() { dcSend("backtogame"); dcSend("tabstatus::active"); endIdleAsk(); }
function endIdleAsk() { if (!idleAsk) return; clearInterval(idleAsk); idleAsk = null; hideCard(); }

function onSessionComplete(m) {
  const r = m.reason || "Unknown";
  log("<b>sessionComplete</b> reason=" + esc(r));
  freeze(); endIdleAsk();
  state.dc = null; try { state.pc?.close(); } catch {}
  if (r === "Migrated" || r === "OtherSessionInitiated") return onTakeover(r);
  const hunt = HUNT.test(r);   // now.gg is picking a host near the player, not dropping us
  if (r === "UserIdleTimeout") { pausePlayClock(); unfreeze(); return offerRetry("<b>Stopped while you were away</b><br>Your progress is saved."); }
  if (r === "ProxyPlaytimeExceeded" || r === "SessionTimeLimitExceeded") { pausePlayClock(); unfreeze(); return offerRetry("<b>now.gg ended this session</b><br>Its playtime limit was reached. Retry starts a new one."); }
  if (r === "AppUnderMaintenance") { pausePlayClock(); unfreeze(); return offerRetry("<b>This game is under maintenance</b><br>Try again later."); }
  // everything else is the box going away under us (its lease ran out, it was pre-empted or crashed): a handoff
  state.handoffs++;
  scheduleReconnect(r, 0, hunt);
}

/* ---- reconnect: unlimited while it keeps moving, with backoff; gives up after 5 minutes of nothing ---- */
const GIVE_UP_MS = 5 * 60000;
function scheduleReconnect(reason = "?", minDelay = 0, hunt = false) {
  if (state.stopping) return;
  if (hunt) state.hunt = true;
  if (reconnecting) { reconnectQueued = true; return; }
  freeze(); pausePlayClock();
  // a hidden tab would be stopped by now.gg anyway (TabHiddenTimeout): reconnect when it is back in view
  if (document.hidden || !navigator.onLine) {
    if (!pendingWhileHidden) log("  " + (document.hidden ? "tab hidden" : "offline") + " -> reconnect when back (" + esc(reason) + ")");
    if (!navigator.onLine) status("No internet connection — waiting…");
    pendingWhileHidden = reason; return;
  }
  reconnecting = true;
  state.tries++;
  if (!state.failSince) state.failSince = Date.now();
  const tryNo = state.tries;
  const delay = Math.max(minDelay, tryNo === 1 ? 0 : Math.min(500 * 2 ** (tryNo - 2), 8000));
  status(state.hunt ? "Finding a machine near you…" : "Reconnecting…" + (tryNo > 2 ? " (try " + tryNo + ")" : ""));
  log("<b>" + (state.hunt ? "looking for a host" : "reconnecting") + "</b> try " + tryNo + " " + esc(reason) + " in " + delay + "ms");
  setTimeout(async () => {
    if (state.stopping) { reconnecting = false; return; }
    try {
      if (!token || !state.playUserToken) await doAuth();
      await establish();
      const pc = state.pc, ok = pc && pc.__answerOk && pc.connectionState !== "failed" && pc.connectionState !== "closed";
      if (ok) { reconnectQueued = false; state.tries = 0; state.failSince = 0; state.hunt = false; log("<b>reconnected</b>"); }
      else reconnectQueued = true;
    } catch (e) {
      log("<b>ERR</b> " + esc(e.message));
      if (Date.now() - state.failSince < GIVE_UP_MS) reconnectQueued = true;
      else { stopPlaying(); unfreeze(); offerRetry(state.vpn ? vpnMsg : "Couldn't reconnect: " + esc(e.message)); }
    } finally {
      reconnecting = false;
      if (reconnectQueued && !state.stopping) { reconnectQueued = false; scheduleReconnect("retry", 0, state.hunt); }
    }
  }, delay);
}
let pendingWhileHidden = null;
function resumePending() { if (!pendingWhileHidden || state.stopping || document.hidden || !navigator.onLine) return; const r = pendingWhileHidden; pendingWhileHidden = null; scheduleReconnect(r); }

function startWatchdog(pc) {
  timers.push(setInterval(async () => {
    if (state.stopping || pc !== state.pc || reconnecting || pendingWhileHidden) return;
    const cs = pc.connectionState;
    if (cs === "failed" || cs === "closed") return scheduleReconnect("watchdog-" + cs);
    if (pc.iceConnectionState === "disconnected") { pc.__disc = pc.__disc || Date.now(); if (Date.now() - pc.__disc > 6000) return scheduleReconnect("watchdog-ice"); } else pc.__disc = 0;
    if (cs === "connected" && !document.hidden) {
      const frames = pc.__lastFrames;
      if (frames != null) { if (frames === pc.__frames) { pc.__stall = pc.__stall || Date.now(); if (Date.now() - pc.__stall > 18000) return scheduleReconnect("watchdog-stall"); } else pc.__stall = 0; pc.__frames = frames; }
    }
    if (!state.dc && pc.__answeredAt && Date.now() - pc.__answeredAt > 15000) return scheduleReconnect("watchdog-no-dc");
  }, 2000));
}

/* ---- HUD (Details) + play clock ---- */
function resumePlayClock() { if (!state.playingSince) state.playingSince = Date.now(); }
function pausePlayClock() { if (state.playingSince) { state.playedMs += Date.now() - state.playingSince; state.playingSince = 0; } }
const playedS = () => (state.playedMs + (state.playingSince ? Date.now() - state.playingSince : 0)) / 1000;
function startHud(pc) {
  pc.__t0 = Date.now();
  let bytes = 0, last = performance.now();
  timers.push(setInterval(async () => {
    if (pc !== state.pc) return;
    let inb = null, pair = null;
    try { (await pc.getStats()).forEach((r) => { if (r.type === "inbound-rtp" && (r.kind === "video" || r.mediaType === "video")) inb = r; if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) pair = r; }); } catch {}
    pc.__lastFrames = inb?.framesDecoded ?? null;
    if ($("hud").classList.contains("on")) {
      const now = performance.now(), kbps = now > last ? (((inb?.bytesReceived ?? 0) - bytes) * 8) / (now - last) : 0; bytes = inb?.bytesReceived ?? 0; last = now;
      const rtt = pair?.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) + "ms" : "?";
      hud(`played ${mmss(playedS())} · machine ${mmss((Date.now() - pc.__t0) / 1000)} · handoffs ${state.handoffs}${state.lastHandoff != null ? " (last " + state.lastHandoff.toFixed(1) + "s)" : ""}\n` +
        `${state.stream ? state.stream.w + "x" + state.stream.h : "-"} fps=${inb?.framesPerSecond ?? "?"} kbps=${kbps.toFixed(0)} rtt=${rtt} lost=${inb?.packetsLost ?? 0} api calls=${state.calls}`);
    }
  }, 1000));
}

/* ---- sound: autoplay with sound is often refused; start muted and offer one click ---- */
function playVideo() {
  video.play().catch(() => { video.muted = true; video.play().catch(() => {}); $("sound").hidden = false; syncMute(); });
}
const syncMute = () => { $("mute").textContent = video.muted ? "Unmute" : "Mute"; if (!video.muted) $("sound").hidden = true; };
$("sound").onclick = () => { video.muted = false; video.play().catch(() => {}); syncMute(); };
$("mute").onclick = () => { video.muted = !video.muted; if (!video.muted) video.play().catch(() => {}); syncMute(); };
video.addEventListener("pointerdown", () => { if (video.muted && !$("sound").hidden) $("sound").click(); });

/* ---- keep the screen awake while playing (a sleeping Chromebook hides the tab -> session ends) ---- */
let wake = null;
async function holdWake() { try { if (!wake && navigator.wakeLock && document.visibilityState === "visible" && !state.stopping) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {} }
function releaseWake() { try { wake?.release(); } catch {} wake = null; }

/* ---- lifecycle ---- */
const dcSend = (s) => { if (state.dc?.readyState === "open") { try { state.dc.send(s); } catch {} } };
// Only real visibility counts. Window blur is NOT sent as inactive: inside Shasta the game is a frame,
// and focus moves to the browser UI all the time — telling now.gg "inactive" then starts its
// TabHiddenTimeout and the game stops by itself. now.gg's own client keys this on visibility too.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { dcSend("tabstatus::inactive"); releaseAll(); }
  else { dcSend("tabstatus::active"); holdWake(); resumePending(); }
});
window.addEventListener("online", () => { log("  back online"); resumePending(); if (state.pc && state.pc.connectionState !== "connected" && !reconnecting) scheduleReconnect("online"); });
window.addEventListener("offline", () => { log("  offline"); if (hadPicture) status("No internet connection — waiting…"); });
window.addEventListener("pagehide", () => { releaseAll(); });

const vpnMsg = "<b>now.gg thinks this is a VPN</b><br>Its play API answered its <i>Proxy/VPN detected</i> page to every route we tried.<br><span style='opacity:.6'>Press Retry in a moment.</span>";
async function play() {
  if (!APP) APP = qs.get("g");
  if (!APP) return card("No game selected.");
  state.stopping = false; state.tries = 0; state.failSince = 0; lastTakeover = 0; state.vpn = false; state.hunt = false; pendingWhileHidden = null; claim();
  $("ovname").textContent = (cfg && cfg.name) || ("app " + APP);
  document.title = (cfg && cfg.name) ? cfg.name : "now.gg";
  if (cfg && cfg.cover && !hadPicture) $("bg").style.backgroundImage = `url("${String(cfg.cover).replace(/["\\]/g, "")}")`;
  status("Starting…"); holdWake();
  if (API === BAKED_API) { const own = await askShellForProxy(); if (own && own !== API) { API = own; log("  proxy " + esc(API) + " (this domain)"); } }
  try { await doAuth(); await establish(); }
  catch (e) { log("<b>ERR</b> " + esc(e.message)); if (e.message === "stopped") return; if (state.vpn) offerRetry(vpnMsg); else scheduleReconnect("start-failed"); }
}

$("ovretry").onclick = () => { state.stopping = false; play(); };
$("ovkeep").onclick = () => keepPlaying();
$("fs").onclick = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
$("det").onclick = () => { const on = $("log").hidden; $("log").hidden = !on; $("hud").classList.toggle("on", on); if (on) $("log").scrollTop = 1e9; };
// the corner buttons show while the pointer moves, then get out of the way
let barT = 0; document.addEventListener("pointermove", () => { $("bar").classList.add("on"); clearTimeout(barT); barT = setTimeout(() => $("bar").classList.remove("on"), 2200); }, { passive: true });
document.addEventListener("keydown", (e) => { if (e.key === "F11" || (e.key === "f" && e.altKey)) { e.preventDefault(); $("fs").click(); } });
play();
})();
</script>
</body>
</html>
