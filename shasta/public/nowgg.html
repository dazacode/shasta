<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>now.gg</title>
<!--
  now.gg player — small, self-contained, no build step.
  Baked into one Store package per game (`window.__NOWGG__` = {appId,name,cover}); auto-plays that game.
  Also works standalone: /nowgg.html?g=<appId>&n=<name>.
  Control plane goes to `window.__NOWGG_PROXY__` (baked: the site's /nowgg proxy) or same-origin /nowgg.
  Protocol recovered from now.gg's own bundle; see ../nowgg-recon/README.md and docs/nowgg.md.
  Minimal by design: no picker, no chrome — video, a Fullscreen button and a Details log.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #e7e7ef; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 5; pointer-events: none; white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #9fe8ff; background: rgba(0, 0, 0, .55); padding: 3px 7px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
  #hud.on, body:hover #hud { opacity: 1; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #overlay.hidden { display: none; }
  #overlay .box { pointer-events: auto; background: rgba(8, 9, 14, .86); border: 1px solid #23263a; border-radius: 14px; padding: 18px 22px; max-width: 460px; box-shadow: 0 18px 60px #000a; }
  #overlay .name { font-size: 17px; font-weight: 600; }
  #overlay .msg { color: #a9aec0; margin-top: 6px; min-height: 1.4em; }
  #overlay .spin { display: inline-block; width: 18px; height: 18px; margin-right: 8px; border: 2px solid #fff3; border-top-color: #fff; border-radius: 50%; vertical-align: -3px; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  button { pointer-events: auto; margin-top: 12px; padding: 8px 14px; background: #1b1b26; color: #e7e7ef; border: 1px solid #2c2c3e; border-radius: 9px; font-weight: 600; cursor: pointer; }
  button:hover { background: #24243a; }
  button:disabled { opacity: .5; cursor: default; }
  #bar { position: fixed; top: 8px; right: 8px; z-index: 6; display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  body:hover #bar, #bar.on { opacity: 1; }
  #bar button { margin: 0; padding: 6px 11px; font-size: 12px; background: rgba(16, 17, 26, .8); }
  #log { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40%; margin: 0; overflow: auto; padding: 8px 12px; font: 11px/1.45 ui-monospace, monospace; color: #9a9ab8; background: rgba(4, 5, 10, .92); border-top: 1px solid #1b1b26; white-space: pre-wrap; }
  #log[hidden] { display: none; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="hud"></div>
<div id="bar"><button id="fs">Fullscreen</button><button id="det">Details</button></div>
<div id="overlay"><div class="box">
  <div class="name" id="ovname">now.gg</div>
  <div class="msg" id="ovtext"><span class="spin"></span>Starting…</div>
  <button id="ovretry" hidden>Retry</button>
</div></div>
<pre id="log" hidden></pre>

<script>
// Baked config for a package build; null when this is the browsable page.
window.__NOWGG__ = /*__CONFIG__*/null;
// The site's /nowgg proxy (baked into a package). null/empty = same-origin /nowgg.
window.__NOWGG_PROXY__ = /*__PROXY__*/null;
</script>
<script>
(() => {
"use strict";
/* ---- config ---- */
const qs = new URLSearchParams(location.search);
const cfg = window.__NOWGG__ || (qs.get("g") ? { appId: qs.get("g"), name: qs.get("n") || "", cover: qs.get("c") || "" } : null);
const API = (window.__NOWGG_PROXY__ || "/nowgg").replace(/\/+$/, "");
const FE = "berlin-v1.54.400-arm.5";
const ALPHA = "useandom26T198340PX75pxJACKVERYMINDBUSHWOLFxGQZbfghjklqvwyzrict"; // no "_" (405s server-side)

let APP = cfg ? String(cfg.appId) : null;

/* ---- tiny dom/helpers ---- */
const $ = (id) => document.getElementById(id);
const video = $("v");
const ts = () => new Date().toISOString().slice(11, 23);
const log = (s) => { const l = $("log"); l.innerHTML += `\n<span style="color:#5a5a78">${ts()}</span> ` + s; if (l.innerHTML.split("\n").length > 500) l.innerHTML = l.innerHTML.split("\n").slice(-500).join("\n"); l.scrollTop = 1e9; };
const hud = (t) => { $("hud").textContent = t; };
const say = (t) => { $("ovtext").innerHTML = t; $("overlay").classList.remove("hidden"); };
const saySpin = (t) => say(`<span class="spin"></span>${t}`);
const hide = () => { $("overlay").classList.add("hidden"); $("ovretry").hidden = true; };
const offerRetry = () => { $("ovretry").hidden = false; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---- identity + guest token, kept on this device so we reattach to the same box ----
 * The session is keyed to the now.gg account (the guest token), NOT the uaId, so the token
 * must persist per origin. Bearer-only: no cookies are needed (verified against the live API). */
function load(key, make) { try { const s = localStorage.getItem(key); if (s) return JSON.parse(s); } catch {} const v = make(); try { localStorage.setItem(key, JSON.stringify(v)); } catch {} return v; }
const id = load("ng-id", () => ({ uaId: "ua-" + nanoid(), uaSessionId: "uasess-" + nanoid(), feSessionId: "fesess-" + nanoid(), visitId: "visitid-" + nanoid() }));
function nanoid(n = 21) { const b = crypto.getRandomValues(new Uint8Array(n)); return [...b].map((x) => ALPHA[x % ALPHA.length]).join(""); }
let token = (() => { try { return localStorage.getItem("ng-token") || null; } catch { return null; } })();
const setToken = (t) => { token = t; try { t ? localStorage.setItem("ng-token", t) : localStorage.removeItem("ng-token"); } catch {} };
function resetIdentity() {
  try { localStorage.removeItem("ng-id"); localStorage.removeItem("ng-token"); } catch {}
  Object.assign(id, load("ng-id", () => ({ uaId: "ua-" + nanoid(), uaSessionId: "uasess-" + nanoid(), feSessionId: "fesess-" + nanoid(), visitId: "visitid-" + nanoid() })));
  setToken(null); playUserToken = null;
}

/* ---- request layer ---- */
const state = { pc: null, dc: null, ck: null, playUserToken: null, sessionId: null, stopping: false, keys: true, showTouches: false, kb: false, migratedSeen: 0, sent: 0, drops: 0, vpn: false, hunt: false };
function headers(json) {
  const h = { "x-ngg-fe-version": FE, lang: "en", accept: "application/json, text/plain, */*",
    "x-location": JSON.stringify({ location: "game_sdk", versionName: "10001", countryCode: "US", platform: "cloud", deviceType: "desktop" }) };
  if (json) h["content-type"] = "application/json";
  if (token) h["authorization"] = "NowV2 " + token;
  if (state.playUserToken) h["x-ngg-playuser-token"] = state.playUserToken;
  return h;
}
async function call(path, { method = "GET", body } = {}) {
  const r = await fetch(API + path, { method, headers: headers(body !== undefined), body: body !== undefined ? JSON.stringify(body) : undefined, credentials: "omit" });
  // its VPN page on getSessionStatus is expected (our own proxy may reach now.gg through a flagged egress),
  // so only a critical call failing that way means the whole flow is blocked.
  const critical = !/getSessionStatus/.test(path);
  if (critical && r.headers.get("x-nowgg-proxy-error")) state.vpn = true;   // now.gg served its "Proxy/VPN detected" HTML page
  const t = await r.text();
  try { return { ...JSON.parse(t), _http: r.status }; } catch { if (critical && /^\s*<(?:!doctype|html)/i.test(t)) state.vpn = true; return { _raw: t.slice(0, 120), _http: r.status }; }
}

/* ---- /oapi/<n> is PER APP and rotates; wrong prefix => 205. Remember the good one. ---- */
let oapiPrefix = "/oapi/1";
const PREFIXES = ["/oapi/1", "/oapi/2", "/oapi/3"];
const prefixCache = (() => { try { return JSON.parse(localStorage.getItem("ng-prefix") || "{}"); } catch { return {}; } })();
function rememberPrefix(p) { prefixCache[APP] = p; try { localStorage.setItem("ng-prefix", JSON.stringify(prefixCache)); } catch {} }
async function resolvePrefix(appId) {
  if (prefixCache[appId]) { oapiPrefix = prefixCache[appId]; return; }
  try { const html = await (await fetch(API + "/apps/" + appId)).text(); const m = html.match(/"assetPrefix":"\/(\d)\/play/); if (m) oapiPrefix = "/oapi/" + m[1]; } catch {}
}

function sessionParams(extra = {}) {
  return { appId: APP, uaId: id.uaId, uaSessionId: id.uaSessionId, feSessionId: id.feSessionId, visitId: id.visitId,
    initialOrientation: "landscape", utmSource: "NA", utmMedium: "NA", utmCampaign: "NA", deepLinkUrl: "", accessCode: "",
    ngReferrer: "NA", pageReferrer: "NA", ngEntryPoint: "NA", ntmSource: "NA", customData: "NA",
    appLaunchExtraData: "NA", launcherData: "NA", feSessionTags: "", membershipId: "", sdpType: "", isIframe: "false",
    feDeviceType: "desktop", feOsName: "mac", ...extra };
}
const munge = (sdp) => String(sdp)
  .replace(/useinbandfec=1/g, "sprop-stereo=1;stereo=1;maxplaybackrate=48000")
  .replace(/minptime=(\d*);/g, "minptime=3;ptime=3;maxptime=20;");

const START_POLICY = { WaitingInQueue: 3000, WaitingInPriorityQueue: 3000, FailureTryAgain: 1500, FailureRetryStartSessionLater: 3000,
  FailureAnotherSessionActive: 2000, FailureSessionMigrated: 1500, FailureNoResource: 5000, FailureInsufficientInstanceCapacity: 5000,
  FailureUserStorageBusy: 3000, FailureNotReady: 3000 };
const START_MAX = 40, NOT_READY_MAX = 21;
const REWARM_ON = new Set(["FailureTryAgain", "FailureInvalidToken", "FailureExpiredCustomToken", "FailureInvalidPlayUser", "FailureUnauthorized"]);

/* now.gg picks a machine for the session and sometimes ends it right away because that machine serves
 * another region (FailureServiceNotInRegion) — the client just starts another. Nothing is wrong here, it
 * is now.gg choosing a host near the player, so say that instead of showing it as a dropped session. */
const HUNT = /Failure.*(Region|NoResource|InsufficientInstanceCapacity|NotReady|UserStorageBusy|RetryStartSessionLater)/;

/* ---- auth ---- */
async function doAuth(force = false) {
  if (!force && token && state.playUserToken) return;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (!token || force) {
      saySpin("Connecting…"); log("<b>guest token</b>" + (attempt ? " (re-auth)" : ""));
      const tok = await call("/accounts/auth/v2/access-token?implicitGuestLogin=true");
      if (!tok.access_token) throw new Error("no token: " + JSON.stringify(tok).slice(0, 160));
      setToken(tok.access_token); force = false;
    }
    saySpin("Creating play user…"); log("<b>createPlayUser</b>");
    const pu = await call(oapiPrefix + "/play/v1/createPlayUser", { method: "POST", body: { uaId: id.uaId } });
    if (pu.status === "FailureUaIdRevoked") { log("  uaId revoked -> new identity"); resetIdentity(); continue; }
    const retryable = pu._http === 401 || ["FailureUnauthorized", "FailureInvalidPlayUser", "FailureTokenExpired", "FailureInvalidToken"].includes(pu.status);
    if (retryable && attempt < 2) { setToken(null); await sleep(400); continue; }
    if (pu.playUserToken) state.playUserToken = pu.playUserToken;
    return;
  }
}

async function beginSession() {
  const alt = PREFIXES.filter((p) => p !== oapiPrefix);
  let notReady = 0, reauths = 0, s;
  saySpin("Starting session…"); log("<b>startSession</b> " + oapiPrefix);
  for (let i = 0; i < START_MAX; i++) {
    s = await call(oapiPrefix + "/play/v1/startSession?" + new URLSearchParams(sessionParams()));
    if (s.status === "Success") break;
    if (s._http === 205) { if (i >= 1 && alt.length) { oapiPrefix = alt.shift(); log("  prefix -> " + oapiPrefix); } continue; }
    if ((s._http === 401 || ["FailureUnauthorized", "FailureInvalidPlayUser", "FailureTokenExpired", "FailureInvalidToken"].includes(s.status)) && reauths++ < 3) { await doAuth(true); continue; }
    if (s.status === "FailureUaIdRevoked") { resetIdentity(); await doAuth(true); continue; }
    if (!(s.status in START_POLICY)) break;
    if (s.status === "FailureNotReady" && ++notReady > NOT_READY_MAX) break;
    const msg = s.status === "FailureUserStorageBusy" ? "Previous session still saving…" : s.status === "FailureNotReady" ? "Instance booting…" : (s.status === "FailureNoResource" || s.status === "FailureInsufficientInstanceCapacity") ? "Waiting for a free instance…" : "Queued…";
    log("  " + s.status); saySpin(msg); await sleep(START_POLICY[s.status]);
  }
  if (!s || s.status !== "Success") throw new Error("startSession: " + JSON.stringify(s || {}).slice(0, 200));
  state.sessionId = s.playSessionId || state.sessionId;
  rememberPrefix(oapiPrefix);
  return s;
}

/* ---- input: touch frames [type, slot, x, y] in CSS px of the displayed video ---- */
function videoBox() { const r = video.getBoundingClientRect(); const vw = video.videoWidth || r.width, vh = video.videoHeight || r.height; const sc = Math.min(r.width / vw, r.height / vh); const w = vw * sc, h = vh * sc; return { left: r.left + (r.width - w) / 2, top: r.top + (r.height - h) / 2, w, h }; }
function sendFrame(type, args) {
  if (!state.dc || state.dc.readyState !== "open") { state.drops++; return; }
  const buf = new ArrayBuffer(2 + args.length * 2); const u16 = new Uint16Array(buf); u16[0] = type; args.forEach((v, i) => (u16[i + 1] = v));
  try { state.dc.send(buf); state.sent++; } catch {}
}
function sendScreenSize() {
  if (!state.dc || state.dc.readyState !== "open") return;
  const b = videoBox(); let w = Math.round(b.w), h = Math.round(b.h); if (!w || !h) return;
  if ((state.stream?.w || 1) >= (state.stream?.h || 0)) [w, h] = [Math.max(w, h), Math.min(w, h)];
  const key = w + "x" + h; if (key === state.sizeSent) return; state.sizeSent = key;
  state.dc.send("screen::size::" + w + "::" + h); log("  screen::size::" + w + "::" + h);
}
function wireInput() {
  let down = false;
  const pos = (e) => { const b = videoBox(); return [Math.ceil(Math.max(0, Math.min(b.w, e.clientX - b.left))), Math.ceil(Math.max(0, Math.min(b.h, e.clientY - b.top)))]; };
  video.addEventListener("pointermove", (e) => { if (down) sendFrame(3, [0, ...pos(e)]); });
  video.addEventListener("pointerdown", (e) => { if (e.button !== 0) return; sendScreenSize(); down = true; try { video.setPointerCapture(e.pointerId); } catch {} sendFrame(1, [0, ...pos(e)]); });
  const up = (e) => { if (!down) return; down = false; sendFrame(2, [0, ...pos(e)]); };
  video.addEventListener("pointerup", up); video.addEventListener("pointercancel", up);
  video.addEventListener("wheel", (e) => { e.preventDefault(); sendFrame(11, [0, 0, 0, (Math.sign(e.deltaY) * 120) & 0xffff]); });
  new ResizeObserver(sendScreenSize).observe(video); window.addEventListener("resize", sendScreenSize); video.addEventListener("resize", sendScreenSize);
  const KEY = { DOWN: 101, UP: 102, NATIVE_DOWN: 91, NATIVE_UP: 92, TEXT: 103 }, MOD = { SHIFT: 1, ALT: 2, CTRL: 4, META: 8, CAPS: 16, SCROLL: 32, NUM: 64 }, SKIP = new Set([27]);
  const mods = (e) => (e.shiftKey ? MOD.SHIFT : 0) | (e.altKey ? MOD.ALT : 0) | (e.ctrlKey ? MOD.CTRL : 0) | (e.metaKey ? MOD.META : 0) | (e.getModifierState?.("CapsLock") ? MOD.CAPS : 0);
  const sendBytes = (a) => { if (state.dc?.readyState === "open") { try { state.dc.send(new Uint8Array(a).buffer); } catch {} } };
  const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
  const onKey = (e, down) => {
    if (!state.keys || state.dc?.readyState !== "open" || e.keyCode === 229 || typing(document.activeElement)) return;
    const code = e.which || e.keyCode, k = e.key; if (!code || !k || k === "Unidentified") return;
    if (!e.ctrlKey && !e.metaKey) e.preventDefault();
    const open = !!state.kb, m = mods(e);
    if (!open) sendBytes([down ? KEY.NATIVE_DOWN : KEY.NATIVE_UP, 1, code & 0xff, m]);
    else if (k.length > 1) { if (!SKIP.has(code)) sendBytes([down ? KEY.DOWN : KEY.UP, 1, code & 0xff, m]); }
    else if (m && /^[a-zA-Z ]$/.test(k)) sendBytes([down ? KEY.DOWN : KEY.UP, 1, code & 0xff, m]);
    else if (down) { const cp = k.codePointAt(0) || 0; sendBytes([KEY.TEXT, 0, 0, 0, cp & 0xff, (cp >> 8) & 0xff]); }
  };
  window.addEventListener("keydown", (e) => onKey(e, true)); window.addEventListener("keyup", (e) => onKey(e, false));
}

/* ---- establish (re-runnable) ---- */
let timers = [], wired = false, reconnecting = false, reconnectQueued = false;
const clearTimers = () => { timers.forEach(clearInterval); timers = []; };

// one owner per account: a second tab of the same game shares the token -> same box. Park it.
const TAB = nanoid(8);
const bc = typeof BroadcastChannel === "function" ? new BroadcastChannel("nowgg-session:" + APP) : null;
function park(html) { state.stopping = true; reconnecting = false; reconnectQueued = false; clearTimers(); try { state.pc?.close(); } catch {} state.pc = state.dc = null; say(html); offerRetry(); log("<b>parked</b>"); }
if (bc) bc.onmessage = (e) => { if (e.data?.type === "claim" && e.data.tab !== TAB && !state.stopping && (state.pc || reconnecting)) park("<b>Playing in another tab</b><br>Retry to play here instead."); };
const claim = () => { try { bc?.postMessage({ type: "claim", tab: TAB }); } catch {} };

let lastTakeover = 0;
function onTakeover(reason) {
  const now = Date.now();
  if (now - lastTakeover < 60000) { lastTakeover = 0; return park("<b>Session opened elsewhere</b><br>Another tab or device is using it.<br>Retry to take it back."); }
  lastTakeover = now; scheduleReconnect(reason);
}

async function establish() {
  clearTimers();
  const wasReconnect = state.sessionId !== null;
  try { state.pc?.close(); } catch {} state.pc = state.dc = null; state.lastSession = null;
  await resolvePrefix(APP);
  const s = await beginSession();
  if (state.stopping) return;

  saySpin("Connecting the picture…"); log("<b>webrtc</b>");
  const pc = new RTCPeerConnection({ iceServers: (s.iceServers || s.iceServersList || []).map((x) => ({ urls: x.urls || x.url, username: x.username, credential: x.credential })) });
  state.pc = pc;
  const remote = new MediaStream();
  pc.ontrack = (e) => { remote.addTrack(e.track); if (video.srcObject !== remote) video.srcObject = remote; video.play().catch(() => {}); log("<b>track</b> " + e.track.kind); hide(); };
  pc.onconnectionstatechange = () => { if (pc !== state.pc) return; log("  pc=" + pc.connectionState); if (pc.connectionState === "failed") scheduleReconnect("pc-failed"); if (pc.connectionState === "connected") reconnecting = false; };
  pc.ondatachannel = (e) => {
    const ch = e.channel; if (/file/i.test(ch.label)) return;
    ch.binaryType = "arraybuffer"; state.dc = ch; log("<b>datachannel</b> " + ch.label);
    ch.onopen = () => { state.sizeSent = null; sendScreenSize(); sendFrame(1, [0, 0, 0]); setTimeout(() => sendFrame(2, [0, 0, 0]), 50); };
    ch.onmessage = (ev) => {
      const str = typeof ev.data === "string" ? ev.data : new TextDecoder().decode(ev.data);
      const m = {}; for (const p of str.split(":::")) { const i = p.indexOf("="); if (i > 0) m[p.slice(0, i)] = p.slice(i + 1); }
      const t = m.msgType || "?";
      if (ch !== state.dc) return;
      if (t === "androidReady") {
        state.stream = { w: +m.streamingWidth || 0, h: +m.streamingHeight || 0 };
        ch.send("osd::0"); ch.send("showtouches::" + (state.showTouches ? "1" : "0")); ch.send("screen::orientation::" + (screen.orientation?.type || "landscape-primary"));
        if (document.visibilityState !== "visible") dcSend("tabstatus::inactive");
        state.sizeSent = null; sendScreenSize(); log("<b>androidReady</b> " + state.stream.w + "x" + state.stream.h);
      }
      if (t === "sessionComplete") onSessionComplete(m);
      if (t === "sessionMigrated" || m.sessionMigrated) setTimeout(() => { if (!(state.dc?.readyState === "open" && pc.connectionState === "connected")) onTakeover("Migrated"); }, 900);
      if (t === "keyboardStatus") state.kb = m.enabled === "true" || m.enabled === true;
      if (t === "showDisconnectTimer") say(`<b>Disconnecting in ${+m.graceIntervalSecs || 59}s</b>`);
      if (t === "discardDisconnectTimer" && state.dc?.readyState === "open") hide();
    };
  };
  if (!wired) { wireInput(); wired = true; video.addEventListener("pointerdown", () => { if (video.muted) video.muted = false; }, { once: true }); }

  await pc.setRemoteDescription({ type: "offer", sdp: s.offerSdp });
  for (const c of s.iceCandidates || []) await pc.addIceCandidate({ candidate: c.candidate || c, sdpMid: c.sdpMid, sdpMLineIndex: c.sdpMLineIndex }).catch(() => {});
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  await sleep(1500);
  if (state.stopping || pc !== state.pc) { try { pc.close(); } catch {} return; }
  const set = await call(oapiPrefix + "/play/v1/setAnswerSdp", { method: "POST", body: { ...sessionParams(), answerSdp: munge(pc.localDescription?.sdp || ans.sdp) } });
  log("  setAnswerSdp=" + (set.status || ("http " + set._http)));
  pc.__answeredAt = Date.now(); pc.__answerOk = set.status === "Success";
  if (set.status !== "Success") { pc.__answeredAt = 0; scheduleReconnect("answer-" + (set.status || set._http), set.status === "FailureRetryStartSessionLater" ? 10000 : 1500); }
  else if (!wasReconnect) hide();

  timers.push(setInterval(() => { if (state.dc?.readyState === "open") state.dc.send("osd::0"); }, 10000));
  timers.push(setInterval(async () => {
    const st = await call(oapiPrefix + "/play/v1/getSessionStatus?" + new URLSearchParams(sessionParams())).catch(() => ({}));
    if (st.sessionStatus === "Migrated") { if (++state.migratedSeen >= 2) { state.migratedSeen = 0; onTakeover("Migrated"); } } else state.migratedSeen = 0;
    if (st.sessionStatus === "BcpuSpotInterrupted" && !pc.__interrupted) { pc.__interrupted = true; scheduleReconnect("BcpuSpotInterruption"); }
  }, 15000));
  startHud(pc); startWatchdog(pc);
}

function startHud(pc) {
  pc.__t0 = Date.now();
  let bytes = 0, last = performance.now();
  timers.push(setInterval(async () => {
    if (pc !== state.pc) return;
    const up = Math.floor((Date.now() - pc.__t0) / 1000);
    let fps = "?", inb = null; try { (await pc.getStats()).forEach((r) => { if (r.type === "inbound-rtp" && (r.kind === "video" || r.mediaType === "video")) inb = r; }); } catch {}
    const now = performance.now(), kbps = now > last ? (((inb?.bytesReceived ?? 0) - bytes) * 8) / (now - last) : 0; bytes = inb?.bytesReceived ?? 0; last = now; if (inb) fps = inb.framesPerSecond ?? "?";
    hud(`pc=${pc.connectionState} ${state.stream ? state.stream.w + "x" + state.stream.h : "-"} box ${Math.floor(up / 60)}:${String(up % 60).padStart(2, "0")}\nfps=${fps} kbps=${kbps.toFixed(0)} frames=${inb?.framesDecoded ?? 0} lost=${inb?.packetsLost ?? 0} sent=${state.sent}`);
  }, 1000));
}

function onSessionComplete(m) {
  const r = m.reason || "Unknown";
  log("<b>sessionComplete</b> reason=" + r);
  state.dc = null; try { state.pc?.close(); } catch {}
  if (r === "Migrated" || r === "OtherSessionInitiated") return onTakeover(r);
  const hunt = HUNT.test(r);   // now.gg is picking a host near the player, not dropping us
  const auto = hunt || ["Unknown", "BcpuSpotInterruption", "BgpuSpotInterruption", "TabHiddenTimeout", "NonPlayAppSessionTimeout"].includes(r);
  if (auto) scheduleReconnect(r, 0, hunt);
  else { say(`<b>Session ended</b><br>reason=${r}`); offerRetry(); }
}

function scheduleReconnect(reason = "?", minDelay = 0, hunt = false) {
  if (state.stopping) return;
  if (reconnecting) { reconnectQueued = true; if (hunt) state.hunt = true; return; }
  reconnecting = true;
  if (hunt) state.hunt = true;
  state.tries = (state.tries || 0) + 1;
  const tryNo = state.tries;
  const delay = Math.max(minDelay, Math.min(1000 * tryNo, 4000));
  const why = " <span style='opacity:.6'>(" + reason + " · try " + tryNo + ")</span>";
  saySpin(hunt ? "Looking for a host near you…" + why + "<br><span style='opacity:.66;font-size:12px'>now.gg is picking a machine for this game. It starts on its own as soon as one is ready — a few tries is normal.</span>" : "Reconnecting…" + why);
  log("<b>" + (hunt ? "looking for a host" : "reconnecting") + "</b> try " + tryNo + " " + reason);
  setTimeout(async () => {
    if (state.stopping) { reconnecting = false; return; }
    try {
      if (!token || !state.playUserToken) await doAuth();
      await establish();
      const pc = state.pc, ok = pc && pc.__answerOk && pc.connectionState !== "failed" && pc.connectionState !== "closed";
      if (ok) { reconnectQueued = false; state.tries = 0; state.hunt = false; log("<b>reconnected</b>"); }
      else reconnectQueued = true;
    } catch (e) { log("<b>ERR</b> " + e.message); if ((state.tries || 0) <= 30) reconnectQueued = true; else { say("Couldn't reconnect: " + e.message); offerRetry(); } }
    finally { reconnecting = false; if (reconnectQueued && !state.stopping) { reconnectQueued = false; scheduleReconnect("retry", 0, state.hunt); } }
  }, delay);
}

function startWatchdog(pc) {
  timers.push(setInterval(async () => {
    if (state.stopping || pc !== state.pc) return;
    const cs = pc.connectionState;
    if (cs === "failed" || cs === "closed") return scheduleReconnect("watchdog-" + cs);
    if (pc.iceConnectionState === "disconnected") { pc.__disc = pc.__disc || Date.now(); if (Date.now() - pc.__disc > 6000) return scheduleReconnect("watchdog-ice"); } else pc.__disc = 0;
    if (cs === "connected") {
      let frames = null; try { (await pc.getStats()).forEach((r) => { if (r.type === "inbound-rtp" && (r.kind === "video" || r.mediaType === "video")) frames = r.framesDecoded ?? 0; }); } catch {}
      if (frames !== null) { if (frames === pc.__frames) { pc.__stall = pc.__stall || Date.now(); if (Date.now() - pc.__stall > 18000) return scheduleReconnect("watchdog-stall"); } else pc.__stall = 0; pc.__frames = frames; }
    }
    if (!state.dc && pc.__answeredAt && Date.now() - pc.__answeredAt > 15000) return scheduleReconnect("watchdog-no-dc");
  }, 2000));
}

/* ---- lifecycle / ui ---- */
const dcSend = (s) => { if (state.dc?.readyState === "open") { try { state.dc.send(s); } catch {} } };
let tabActive = null;
window.addEventListener("focus", () => { if (tabActive !== true) { tabActive = true; dcSend("tabstatus::active"); } });
window.addEventListener("blur", () => { if (tabActive !== false) { tabActive = false; dcSend("tabstatus::inactive"); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) { tabActive = false; dcSend("tabstatus::inactive"); } else if (tabActive !== true) { tabActive = true; dcSend("tabstatus::active"); } });

async function play() {
  if (!APP) APP = qs.get("g");
  state.stopping = false; state.tries = 0; lastTakeover = 0; state.vpn = false; state.hunt = false; claim();
  $("ovname").textContent = (cfg && cfg.name) || ("app " + APP);
  document.title = (cfg && cfg.name) ? cfg.name : "now.gg";
  saySpin("Starting…");
  try { await doAuth(); await establish(); }
  catch (e) { log("<b>ERR</b> " + e.message); offerRetry(); if (state.vpn) say("<b>now.gg thinks this is a VPN</b><br>Its play API answered its <i>Proxy/VPN detected</i> page to every route we tried.<br><span style='opacity:.6'>Press Retry in a moment.</span>"); else say("Error: " + e.message); }
}

$("ovretry").onclick = () => { state.stopping = false; state.tries = 0; play(); };
$("fs").onclick = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.(); };
$("det").onclick = () => { $("log").hidden = !$("log").hidden; $("hud").classList.toggle("on", !$("log").hidden); };
document.addEventListener("keydown", (e) => { if (e.key === "f" && !state.kb) $("fs").click(); });
play();
})();
</script>
</body>
</html>
